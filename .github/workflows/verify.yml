name: Verify course starters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-basic:
    name: Java basic starter (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run Java basic starter
        working-directory: courses/02-java-basic
        run: ./run.sh

