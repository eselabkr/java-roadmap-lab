name: 과제 또는 실행 오류
description: 문서 오류, 모호한 요구사항, 실행 스크립트 문제를 제보합니다.
title: "[Problem] "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: 발생 위치
      description: 파일과 섹션 또는 실행한 명령을 적어 주세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제와 Java 버전을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true

